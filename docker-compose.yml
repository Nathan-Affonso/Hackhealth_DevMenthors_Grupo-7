services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blh
      POSTGRES_USER: blh
      POSTGRES_PASSWORD: blh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blh -d blh"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    platform: ${PLATFORM:-linux/amd64}
    build:
      context: ./backend
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:8.0}
        DOTNET_RUNTIME_IMAGE: ${DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet:8.0}
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=blh;Username=blh;Password=blh
      Jwt__Key: BLH-dev-key-change-in-production-with-at-least-32-chars
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    platform: ${PLATFORM:-linux/amd64}
    environment:
      VITE_API_URL: /api
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
